    - "Slim body"
    - "Wide muzzle"
    - "Narrow muzzle"
    - "Large nose"
    - "Small nose"
    - "Broad paws"
    - "Small paws"
    - "Short, dense fur"
    - "Fine, soft fur"
    - "Simple or spotted coat"
    - "Striped or marbled coat"
    - "Short whiskers"
    - "Long whiskers"
    - "Expressive face"
    - "Neutral face"
    - "Square or upright posture"
    - "Crouched or perched posture"