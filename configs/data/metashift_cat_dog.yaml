defaults:
  - data_defaults # Inherit data_defaults arguments
dataset: 'MetaShiftCatDog' # Name of the dataset
data_path: '/home/yk449/datasets/MetaShift/Cat-Dog-indoor-outdoor/train-val-equal-distribution/' # Path to the dataset
num_classes: 2 # Number of classes of the target variable
num_concepts: 28  # Number of concepts in dataset

subpopulations:
# [class, attribute]
  - ['cat', 'indoor']
  - ['cat', 'outdoor']
  - ['dog', 'indoor']
  - ['dog', 'outdoor']


